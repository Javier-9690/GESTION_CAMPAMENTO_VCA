<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Hotel Analytics{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #117A65;
            --accent-dark: #0E6655;
        }
        body { background: #f4f6f9; }

        .app-navbar {
            background: linear-gradient(135deg, #0E6655 0%, #117A65 60%, #1ABC9C 100%);
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            padding: 0;
        }
        .app-navbar-shell { flex-direction: column; padding: 0; }
        .app-brand-row {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: .4rem 1.2rem;
        }
        .app-brand-center { text-align: center; flex: 1; }
        .app-title {
            color: #fff !important; text-decoration: none;
            font-size: 1.35rem; font-weight: 700; letter-spacing: .5px;
        }
        .app-title i { margin-right: .35rem; }
        .app-nav-row {
            width: 100%; border-top: 1px solid rgba(255,255,255,.15);
            padding: .2rem 1rem;
        }
        .app-navbar-menu .nav-link {
            color: rgba(255,255,255,.85) !important; font-size: .9rem; padding: .3rem .75rem;
        }
        .app-navbar-menu .nav-link:hover,
        .app-navbar-menu .nav-link.active { color: #fff !important; }
        .app-navbar-menu .nav-link.active { border-bottom: 2px solid #fff; }

        .card { border: none; border-radius: .6rem; }
        .card.shadow-sm { box-shadow: 0 2px 8px rgba(0,0,0,.08) !important; }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .stat-card { border-left: 4px solid var(--accent); }
        .stat-card .stat-val { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .stat-card .stat-lbl { font-size: .8rem; color: #6c757d; text-transform: uppercase; letter-spacing: .5px; }
        .table thead th { background: #117A65; color: #fff; font-size: .82rem; }
        .progress { height: 8px; }
        .progress-bar { background: var(--accent); }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top app-navbar">
        <div class="container-fluid app-navbar-shell">
            <div class="app-brand-row">
                <div style="width:80px"></div>
                <div class="app-brand-center">
                    <a class="app-title" href="/">
                        <i class="bi bi-bar-chart-line"></i>
                        <span>Hotel Analytics VCA</span>
                    </a>
                </div>
                <div style="width:80px"></div>
            </div>
            <div class="app-nav-row">
                <div class="collapse navbar-collapse app-navbar-menu" id="navMain">
                    <ul class="navbar-nav ms-lg-auto">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                                <i class="bi bi-house"></i> Inicio
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-2 px-md-4 py-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
